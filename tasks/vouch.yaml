# yaml-language-server: $schema=https://raw.githubusercontent.com/defenseunicorns/maru-runner/refs/heads/main/tasks.schema.json

tasks:

  - name: package
    description: Vouch for a signed Zarf package via OLM, pushing attestations to CAT
    inputs:
      zarf_package:
        description: Path to the Zarf package .tar.zst to vouch. If unset, uses the most recent zarf-package-*.tar.zst in the current directory.
        default: ""
      attestations:
        description: Comma-separated list of Witness JSON attestation files to include
        default: ""
      sarif_files:
        description: Comma-separated list of SARIF files to include as evidence
        default: ""
      olm_cat:
        description: Domain of the CAT instance
        default: ""
      olm_org:
        description: OLM organization name
        default: ""
      olm_project:
        description: CAT project name. Defaults to the Zarf package name when empty. Use the same project when generating a Fulcio token.
        default: ""
      olm_cat_token:
        description: CAT personal access token (cat_...) for CAT authentication instead of runner OIDC. Alternatively set OLM_CAT_TOKEN. Mutually exclusive with olm_identity_token / OLM_IDENTITY_TOKEN.
        default: ""
      olm_identity_token:
        description: OIDC identity token for CAT authentication. For GitLab runner OIDC, request id_tokens with aud=cat and pass $OLM_ID_TOKEN. Alternatively set OLM_IDENTITY_TOKEN. Leave empty for CAT-token, GitHub ambient OIDC, or interactive auth.
        default: ""
      test_directory:
        description: Path to the test directory to pass to olm vouch. Leave empty to skip.
        default: tests
      uds_bundle:
        description: Path to a uds-bundle.yaml to attest as a sandbox-deployment material. Leave empty to skip.
        default: ""
    actions:
      - description: Vouch for Zarf package via OLM
        shell:
          linux: bash
          darwin: bash
        cmd: |
          set -Eeuo pipefail
          trap 'printf "ERROR: udm-vouch:package failed (exit %s, line %s). See output above.\n" "$?" "$LINENO" >&2' ERR
          export PATH="$HOME/.local/bin:$PATH"

          ATTESTATIONS="${{ .inputs.attestations }}"
          SARIF_FILES="${{ .inputs.sarif_files }}"
          TEST_DIRECTORY="${{ .inputs.test_directory }}"
          OLM_CAT="${{ .inputs.olm_cat }}"
          OLM_ORG="${{ .inputs.olm_org }}"
          OLM_PROJECT="${{ .inputs.olm_project }}"

          PACKAGE="${{ .inputs.zarf_package }}"
          if [ -z "$PACKAGE" ]; then
            while IFS= read -r p; do
              if [ -z "$PACKAGE" ] || [ "$p" -nt "$PACKAGE" ]; then
                PACKAGE="$p"
              fi
            done < <(find . -maxdepth 1 -name "zarf-package-*.tar.zst" -type f)
          fi
          if [ -z "$PACKAGE" ]; then
            echo "No zarf-package-*.tar.zst file found."
            exit 1
          fi
          if [ ! -f "$PACKAGE" ]; then
            echo "Zarf package not found: $PACKAGE"
            exit 1
          fi

          if [ -z "$OLM_CAT" ]; then
            echo "No OLM_CAT configured. Skipping OLM vouch for local run."
            exit 0
          fi

          ATTESTATION_FILES=()
          if [ -n "$ATTESTATIONS" ]; then
            IFS=',' read -ra PROVIDED_ATTESTATIONS <<< "$ATTESTATIONS"
            for attestation in "${PROVIDED_ATTESTATIONS[@]}"; do
              attestation="${attestation#"${attestation%%[![:space:]]*}"}"
              attestation="${attestation%"${attestation##*[![:space:]]}"}"
              if [ -z "$attestation" ]; then
                continue
              fi
              if [ -s "$attestation" ]; then
                ATTESTATION_FILES+=("$attestation")
              else
                echo "Skipping missing attestation file: $attestation"
              fi
            done
          fi

          SARIF_EVIDENCE_FILES=()
          if [ -n "$SARIF_FILES" ]; then
            IFS=',' read -ra PROVIDED_SARIF_FILES <<< "$SARIF_FILES"
            for sarif_file in "${PROVIDED_SARIF_FILES[@]}"; do
              sarif_file="${sarif_file#"${sarif_file%%[![:space:]]*}"}"
              sarif_file="${sarif_file%"${sarif_file##*[![:space:]]}"}"
              if [ -z "$sarif_file" ]; then
                continue
              fi
              if [ -s "$sarif_file" ]; then
                SARIF_EVIDENCE_FILES+=("$sarif_file")
              else
                echo "Skipping missing SARIF file: $sarif_file"
              fi
            done
          fi

          # Pass credentials through the environment so nested tasks keep the
          # same auth mode without adding secrets to command arguments.
          OLM_CAT_TOKEN_INPUT="${{ .inputs.olm_cat_token }}"
          OLM_IDENTITY_TOKEN_INPUT="${{ .inputs.olm_identity_token }}"
          export OLM_CAT_TOKEN="${OLM_CAT_TOKEN_INPUT:-${OLM_CAT_TOKEN:-}}"
          export OLM_IDENTITY_TOKEN="${OLM_IDENTITY_TOKEN_INPUT:-${OLM_IDENTITY_TOKEN:-}}"
          if [ -n "$OLM_CAT_TOKEN" ] && [ -n "$OLM_IDENTITY_TOKEN" ]; then
            echo "ERROR: CAT token and identity token are mutually exclusive. Set only one of olm_cat_token / OLM_CAT_TOKEN or olm_identity_token / OLM_IDENTITY_TOKEN." >&2
            exit 1
          fi

          OLM_ARGS=()
          if [ -n "$OLM_CAT" ]; then
            OLM_ARGS+=(--cat "$OLM_CAT")
          fi
          if [ -n "$OLM_PROJECT" ]; then
            OLM_ARGS+=(--project "$OLM_PROJECT")
          fi
          if [ -n "$OLM_ORG" ]; then
            OLM_ARGS+=(--org "$OLM_ORG")
          fi
          if [ "${#SARIF_EVIDENCE_FILES[@]}" -gt 0 ]; then
            ALL_SARIF_EVIDENCE=$(IFS=,; echo "${SARIF_EVIDENCE_FILES[*]}")
            OLM_ARGS+=(--sarif-evidence "$ALL_SARIF_EVIDENCE")
          fi
          if [ -n "$TEST_DIRECTORY" ] && [ -d "$TEST_DIRECTORY" ]; then
            OLM_ARGS+=(--test-directory "$TEST_DIRECTORY")
          fi
          if [ "${#ATTESTATION_FILES[@]}" -gt 0 ]; then
            ALL_ATTESTATIONS=$(IFS=,; echo "${ATTESTATION_FILES[*]}")
            OLM_ARGS+=(--attestations "$ALL_ATTESTATIONS")
          else
            echo "No Witness attestations provided; running OLM vouch without --attestations."
          fi
          UDS_BUNDLE="${{ .inputs.uds_bundle }}"
          if [ -n "$UDS_BUNDLE" ]; then
            OLM_ARGS+=(--uds-bundle "$UDS_BUNDLE")
          fi
          echo "====== Installing OLM CLI plugin ======"
          uds run udm-olm:setup --no-progress
          echo "====== Running OLM vouch $(./olm version) ======"

          ./olm vouch "$PACKAGE" \
            "${OLM_ARGS[@]}" \
            --log-level debug
